<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Wizardocs</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;1,9..144,400&display=swap">

<style>
  :root {
    --bg: #0a0a0f;
    --bg-2: #0d0d14;
    --surface: #12121a;
    --surface-2: #171722;
    --surface-3: #1e1e2c;
    --line: #22222f;
    --line-2: #2c2c3c;
    --ink: #e8e6e0;
    --ink-2: #b8b6b0;
    --ink-3: #78767a;
    --ink-4: #4a4854;
    --accent: #f07c9e;
    --accent-2: #ff9ab8;
    --accent-glow: rgba(240, 124, 158, 0.35);
    --accent-soft: rgba(240, 124, 158, 0.08);
    --good: #7dd3a3;
    --warn: #f5b57c;
    --danger: #f57c8b;
    --radius: 10px;
    --radius-sm: 6px;
    --font-display: "Space Grotesk", ui-sans-serif, system-ui, sans-serif;
    --font-sans: "Space Grotesk", ui-sans-serif, system-ui, sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, monospace;
    --font-serif: "Fraunces", ui-serif, Georgia, serif;
  }

  [data-accent="blue"]    { --accent:#6aa8ff; --accent-2:#8cc0ff; --accent-glow: rgba(106,168,255,0.35); --accent-soft: rgba(106,168,255,0.08); }
  [data-accent="emerald"] { --accent:#5ad1a4; --accent-2:#7de0bb; --accent-glow: rgba(90,209,164,0.35); --accent-soft: rgba(90,209,164,0.08); }
  [data-accent="amber"]   { --accent:#f2b06b; --accent-2:#ffc98a; --accent-glow: rgba(242,176,107,0.35); --accent-soft: rgba(242,176,107,0.08); }
  [data-accent="rose"]    { --accent:#f07c9e; --accent-2:#ff9ab8; --accent-glow: rgba(240,124,158,0.35); --accent-soft: rgba(240,124,158,0.08); }
  [data-accent="violet"]  { --accent:#8b7cf6; --accent-2:#a594ff; --accent-glow: rgba(139,124,246,0.35); --accent-soft: rgba(139,124,246,0.08); }

  [data-theme="light"] {
    --bg:#f4f1ea; --bg-2:#efece4; --surface:#fbf8f1; --surface-2:#f1ede4; --surface-3:#e9e3d6;
    --line:#dfd8c8; --line-2:#cfc6b0;
    --ink:#17161a; --ink-2:#44424a; --ink-3:#7a7780; --ink-4:#b0ada8;
  }

  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; }
  body {
    font-family: var(--font-sans);
    background: var(--bg);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    overflow-x: hidden;
    min-height: 100vh;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
  input, textarea { font: inherit; color: inherit; }
  a { color: inherit; text-decoration: none; }

  body::before {
    content: "";
    position: fixed; inset: 0;
    pointer-events: none;
    background:
      radial-gradient(1200px 800px at 80% -10%, var(--accent-soft), transparent 60%),
      radial-gradient(900px 600px at -10% 110%, var(--accent-soft), transparent 60%);
    z-index: 0;
    opacity: 0.8;
  }
  body::after {
    content:"";
    position: fixed; inset:0;
    pointer-events:none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.5 0 0 0 0 0.5 0 0 0 0 0.5 0 0 0 0.35 0'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='0.5'/></svg>");
    opacity: 0.035;
    mix-blend-mode: overlay;
    z-index:1;
  }

  #root { position: relative; z-index: 2; }

  .mono { font-family: var(--font-mono); }
  .serif { font-family: var(--font-serif); }
  .chip {
    display:inline-flex; align-items:center; gap:6px;
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--ink-2);
    border: 1px solid var(--line);
    padding: 4px 8px;
    border-radius: 999px;
    background: var(--surface);
  }
  .chip .dot {
    width:6px; height:6px; border-radius:50%;
    background: var(--accent);
    box-shadow: 0 0 10px var(--accent-glow);
  }
  .btn {
    display:inline-flex; align-items:center; gap:8px;
    padding: 10px 16px;
    border-radius: var(--radius);
    border: 1px solid var(--line-2);
    font-weight: 500; font-size: 14px;
    background: var(--surface);
    transition: background .2s, border-color .2s, transform .1s;
  }
  .btn:hover { border-color: var(--accent); background: var(--surface-2); }
  .btn:active { transform: translateY(1px); }
  .btn.primary {
    background: var(--accent);
    color: #0a0a0f;
    border-color: transparent;
    box-shadow: 0 0 40px -10px var(--accent-glow), inset 0 1px 0 rgba(255,255,255,0.2);
  }
  .btn.primary:hover { background: var(--accent-2); }
  .btn.ghost { background: transparent; border-color: transparent; }
  .btn.ghost:hover { background: var(--surface); border-color: var(--line); }

  .kbd {
    font-family: var(--font-mono);
    font-size: 11px;
    padding: 2px 6px;
    border-radius: 4px;
    background: var(--surface-3);
    border: 1px solid var(--line);
    color: var(--ink-2);
  }

  .glow-text {
    background: linear-gradient(90deg, var(--ink) 0%, var(--ink) 40%, var(--accent-2) 60%, var(--ink) 80%);
    background-size: 200% 100%;
    -webkit-background-clip: text; background-clip: text;
    color: transparent;
    animation: shimmer 8s linear infinite;
  }
  @keyframes shimmer { from { background-position: 200% 0 } to { background-position: -200% 0 } }

  [data-motion="low"] .glow-text { animation: none; }
  [data-motion="none"] * { animation-duration: 0s !important; transition-duration: 0s !important; }

  .no-scrollbar::-webkit-scrollbar { display: none }
  .no-scrollbar { scrollbar-width: none; }

  /* Custom scrollbar — dark-themed to match the app */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 999px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--ink-4); }
  ::-webkit-scrollbar-corner { background: transparent; }
  * { scrollbar-width: thin; scrollbar-color: var(--line-2) transparent; }

  .page-enter { animation: pageIn .45s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes pageIn {
    from { opacity: 0; transform: translateY(8px) }
    to   { opacity: 1; transform: translateY(0) }
  }

  #splash {
    position: fixed; inset: 0;
    display: grid; place-items: center;
    background: var(--bg);
    z-index: 1000;
    transition: opacity .4s;
  }
  #splash.hide { opacity: 0; pointer-events: none; }
  .splash-logo {
    font-family: var(--font-serif);
    font-style: italic;
    font-size: 32px;
    letter-spacing: -0.02em;
  }
</style>
</head>
<body data-theme="dark" data-accent="rose" data-motion="low">

<div id="splash">
  <div class="splash-logo">Wizardocs<span style="color:var(--accent)">.</span></div>
</div>

<div id="root"></div>

<script type="module" src="/src/main.jsx"></script>

</body>
</html>
