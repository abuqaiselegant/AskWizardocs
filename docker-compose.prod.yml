# Production stack for a single VM (AWS Lightsail / EC2, Oracle, Hetzner, ...).
# Two containers:
#   - api   : the FastAPI backend (corpus + frontend baked into the image)
#   - caddy : public entrypoint, auto-HTTPS, reverse-proxies to api
#
# Start:  docker compose -f docker-compose.prod.yml up -d --build
# Logs:   docker compose -f docker-compose.prod.yml logs -f
# Stop:   docker compose -f docker-compose.prod.yml down

services:
  api:
    build: .
    restart: unless-stopped
    env_file:
      - .env                # OPENAI_API_KEY, COHERE_API_KEY, SUPABASE_* (never committed)
    expose:
      - "8000"              # internal only — not published to the host; Caddy is the only public door

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data     # persists issued TLS certs across restarts (avoids re-issuing / rate limits)
      - caddy_config:/config
    depends_on:
      - api

volumes:
  caddy_data:
  caddy_config:
