# Runs the offline test suite on every push and pull request.
#
# Installs pytest, fastapi and httpx — and nothing else. The test files register
# stand-ins for bm25_retriever, vector_retriever, reranker, llm, generator,
# requests, dotenv and jwt in sys.modules before importing anything, so the suite
# never reaches chromadb, cohere, openai, the 19 MB corpus or the network.
#
# fastapi (+ httpx2, which starlette's TestClient needs — plain httpx still
# works but warns that it is deprecated) is here so api/main.py
# can be covered at all: the endpoints are where the quota refunds, the SSE
# protocol and the bookmark plan-gate live, and none of that is reachable
# without constructing the app. Measured: 20 packages, 4 s. Installing
# requirements.txt instead would be ~96 packages and a minute of wall clock, to
# test functions that mostly need hashlib — so the line is drawn at what the app
# needs to exist, not at what it needs to run.
#
# No API keys, no corpus, no network — still the point of the suite rather than
# an accident of it.
#
# If a future test needs a dependency beyond these three, this job fails on
# ImportError rather than passing quietly — which is the right way round.

name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pytest fastapi httpx2

      # Run from the repo root so `src.` resolves (same as requirements-dev.txt says).
      - run: python -m pytest tests/ -q
